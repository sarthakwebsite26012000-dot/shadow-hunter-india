<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shadow Hunter India</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      margin: 0 auto;
      background: #821e1e;
      width: 480px;
      height: 800px;
      border: 2px solid #444;
      touch-action: manipulation;
    }
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-sizing: border-box;
      z-index: 10;
    }
    #hud span {
      font-size: 14px;
    }
    #canvas {
      position: absolute;
      top: 60px;
      left: 0;
    }
    #message {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 4px;
      font-size: 14px;
      display: none;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <span id="hud-level">Level: 1</span>
      <span id="hud-gems">Gems: 0</span>
      <span id="hud-enemies">Enemies: 0</span>
    </div>
    <canvas id="canvas" width="480" height="740"></canvas>
    <div id="message"></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
